<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeSprint 2026 — Admin Control</title>
    <meta name="description" content="CodeSprint 2026 Admin Control Panel — Registrations, Events, Timeline, Broadcast & more" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <!-- Firebase SDK (CDN) for Google Sign-In -->
    <script type="module">
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
      import { getAuth, GoogleAuthProvider, signInWithPopup } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

      const firebaseConfig = {
        apiKey: "%VITE_FIREBASE_API_KEY%",
        authDomain: "%VITE_FIREBASE_AUTH_DOMAIN%",
        projectId: "%VITE_FIREBASE_PROJECT_ID%",
        storageBucket: "%VITE_FIREBASE_STORAGE_BUCKET%",
        messagingSenderId: "%VITE_FIREBASE_MESSAGING_SENDER_ID%",
        appId: "%VITE_FIREBASE_APP_ID%"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const googleProvider = new GoogleAuthProvider();
      googleProvider.addScope('email');
      googleProvider.addScope('profile');

      // Expose globally so React components can use it
      window.__firebaseAuth = auth;
      window.__googleProvider = googleProvider;
      window.__signInWithPopup = signInWithPopup;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
